<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚨 생존 페르시아어 (조교 전용)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            padding-top: 80px; 
        }
        .header {
            position: fixed; top: 0; left: 0; width: 100%;
            background-color: #2c3e50;
            padding: 15px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .header-title { color: #fff; font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; text-align: center; }
        .search-box {
            width: 100%; padding: 12px 15px; border: none; border-radius: 8px;
            font-size: 1rem; font-family: inherit; outline: none;
        }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        
        .card {
            background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid #3498db;
            transition: all 0.2s;
        }
        .card:active { transform: scale(0.98); }
        
        .tag {
            display: inline-block; padding: 4px 8px; border-radius: 4px; 
            font-size: 0.75rem; font-weight: bold; color: #fff; margin-bottom: 8px;
        }
        .tag.urgent { background-color: #e74c3c; } 
        .tag.office { background-color: #2ecc71; } 
        .tag.escape { background-color: #f39c12; } 
        .tag.basic { background-color: #9b59b6; } 
        
        .ko-text { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; color: #2c3e50; }
        .pronunciation { 
            font-size: 1.2rem; font-weight: 700; color: #e74c3c; 
            background-color: #fff0f0; padding: 10px; border-radius: 8px; margin-bottom: 10px;
        }
        .fa-text { 
            font-family: 'Vazirmatn', sans-serif; font-size: 1.4rem; color: #7f8c8d; 
            text-align: right; direction: rtl; margin-bottom: 10px;
        }
        .copy-btn {
            width: 100%; padding: 10px; border: none; border-radius: 6px;
            background-color: #ecf0f1; color: #7f8c8d; font-weight: bold; font-size: 0.9rem;
            cursor: pointer; transition: 0.2s;
        }
        .copy-btn:active { background-color: #bdc3c7; }
        .no-result { text-align: center; color: #95a5a6; padding: 30px; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">🚨 교수님 등장! 생존 검색기</div>
        <input type="text" id="searchInput" class="search-box" placeholder="상황 검색 (예: 프린트, 기다려, 몰라요)..." onkeyup="filterCards()">
    </div>

    <div class="container" id="cardContainer">
        </div>
    
    <div id="noResultMsg" class="no-result">
        "검색 결과가 없습니다.<br>영어로 대답하고 대장 조교를 부르세요."
    </div>

    <script>
        // === 데이터 관리 영역 (여기에 단어를 추가/수정하면 됨) ===
        const wordData = [
            // [회피기 & 상황 종결]
            { tagClass: "escape", tagText: "#회피기", ko: "몰라요", pron: "네미두남", fa: "نمی‌دونم", keywords: "몰라요 모릅니다" },
            { tagClass: "escape", tagText: "#회피기", ko: "기억이 안 나요", pron: "여담 니스트", fa: "یادم نیست", keywords: "기억 안나 까먹" },
            { tagClass: "escape", tagText: "#회피기", ko: "정확히는 모르겠습니다", pron: "다기간 네미두남", fa: "دقیقاً نمی‌دونم", keywords: "정확히 몰라요" },
            { tagClass: "escape", tagText: "#회피기", ko: "죄송하지만, 저 페르시아어 잘 못해요.", pron: "베바크쉬드, 만 쿱 파르시 발라드 니스탐", fa: "ببخشید، من خوب فارسی بلد نیستم", keywords: "못해요 한국어 영어" },
            { tagClass: "escape", tagText: "#회피기", ko: "여기에 적어주시겠어요?", pron: "미쉐 인저 베네비시드?", fa: "میشه اینجا بنویسید؟", keywords: "적어 글씨 스펠링" },
            { tagClass: "escape", tagText: "#회피기", ko: "이메일로 보내주세요.", pron: "롯판 이메일 베페레스티드", fa: "لطفاً ایمیل بفرستید", keywords: "이메일 메일 보내" },
            { tagClass: "escape", tagText: "#회피기", ko: "지금 OOO에게 전화할게요.", pron: "알언 베 OOO 장 미자남", fa: "الان به 000 زنگ می زنم", keywords: "전화 연락 부를게요 대장 조교" },
            { tagClass: "escape", tagText: "#회피기", ko: "나중에 다시 연락드릴게요.", pron: "바단 도버레 버 쇼버 타버스 미기람", fa: "بعداً دوباره با شما تماس می‌گیرم", keywords: "나중에 다시 연락" },

            // [급할때 & 기본 응대]
            { tagClass: "urgent", tagText: "#급할때", ko: "안녕하세요", pron: "살럼", fa: "سلام", keywords: "인사 안녕" },
            { tagClass: "urgent", tagText: "#급할때", ko: "어서 오세요 / 말씀하세요 / 여기 있습니다", pron: "베파르머이드", fa: "بفرمایید", keywords: "어서오세요 말씀하세요 여기" },
            { tagClass: "urgent", tagText: "#급할때", ko: "알겠습니다 / 이해했습니다", pron: "파흐미담", fa: "فهمیدم", keywords: "알겠 이해" },
            { tagClass: "urgent", tagText: "#급할때", ko: "네 / 아니요", pron: "발레 / 나", fa: "بله / نه", keywords: "네 아니요 응" },
            { tagClass: "urgent", tagText: "#급할때", ko: "다 되었습니다 / 끝났습니다", pron: "타멈 쇼드", fa: "تمام شد", keywords: "다끝 완료" },
            { tagClass: "urgent", tagText: "#급할때", ko: "잠시만 기다려주세요", pron: "옉 라흐제 사브르 코니드 롯판", fa: "یک لحظه صبر کنید لطفاً", keywords: "기다려 잠시만" },
            { tagClass: "urgent", tagText: "#급할때", ko: "문제없습니다 / 괜찮습니다", pron: "모쉬켈리 니스트", fa: "مشکلی نیست", keywords: "문제 괜찮 알겠" },
            { tagClass: "urgent", tagText: "#급할때", ko: "다시 말씀해 주세요", pron: "롯판 도버레 베기드", fa: "لطفاً دوباره بگید", keywords: "다시 한번" },
            { tagClass: "urgent", tagText: "#급할때", ko: "이거 필요한가요?", pron: "인 러제메?", fa: "این لازمه؟", keywords: "필요 이거" },

            // [실무 단어]
            { tagClass: "office", tagText: "#실무단어", ko: "교수님", pron: "오스터드", fa: "استاد", keywords: "교수" },
            { tagClass: "office", tagText: "#실무단어", ko: "서명(사인) / 여기에 서명해 주세요.", pron: "엠자 / 롯판 인저 엠저 코니드", fa: "امضا / لطفاً اینجا امضا کنید", keywords: "서명 사인 결재" },
            { tagClass: "office", tagText: "#실무단어", ko: "프린트 / 복사 / 복사할까요?", pron: "찹 / 코피 / 코피 코남?", fa: "چاپ / کپی / کپی کنم؟", keywords: "프린트 복사 인쇄" },
            { tagClass: "office", tagText: "#실무단어", ko: "행정실 / 사무실", pron: "에더레 / 다프타르", fa: "اداره / دفتر", keywords: "사무실 행정실" },
            { tagClass: "office", tagText: "#실무단어", ko: "수업 / 강의실", pron: "켈러스", fa: "کلاس", keywords: "수업 강의실" },
            { tagClass: "office", tagText: "#실무단어", ko: "시험", pron: "엠테헌", fa: "امتحان", keywords: "시험" },
            { tagClass: "office", tagText: "#실무단어", ko: "종이", pron: "커가즈", fa: "کاغذ", keywords: "종이 a4" },
            { tagClass: "office", tagText: "#실무단어", ko: "대학교", pron: "더네쉬거", fa: "دانشگاه", keywords: "대학교" },
            { tagClass: "office", tagText: "#실무단어", ko: "책", pron: "케텁", fa: "کتاب", keywords: "책 교재" },

            // [기본 단어 (명사/부사)]
            { tagClass: "basic", tagText: "#기본단어", ko: "제발, 부디 (Please)", pron: "롯판", fa: "لطفاً", keywords: "제발 부디" },
            { tagClass: "basic", tagText: "#기본단어", ko: "연락", pron: "타머스", fa: "تماس", keywords: "연락" },
            { tagClass: "basic", tagText: "#기본단어", ko: "지금", pron: "알언", fa: "الان", keywords: "지금 당장" },
            { tagClass: "basic", tagText: "#기본단어", ko: "오늘", pron: "엠루즈", fa: "امروز", keywords: "오늘" },
            { tagClass: "basic", tagText: "#기본단어", ko: "내일", pron: "파르더", fa: "فردا", keywords: "내일" },
            { tagClass: "basic", tagText: "#기본단어", ko: "다음 주", pron: "하프테-예 바드", fa: "هفته‌ی بعد", keywords: "다음주" },
            { tagClass: "basic", tagText: "#기본단어", ko: "지난 주", pron: "하프테-예 피쉬", fa: "هفته‌ی پیش", keywords: "지난주" },
            { tagClass: "basic", tagText: "#기본단어", ko: "주말", pron: "어카레 하프테", fa: "آخر هفته", keywords: "주말 토요일 일요일" },
            { tagClass: "basic", tagText: "#기본단어", ko: "휴일 / 쉬는 날", pron: "타틸", fa: "تعطیل", keywords: "휴일 쉬는날 방학" },
            { tagClass: "basic", tagText: "#기본단어", ko: "필요", pron: "라젬 / 니여즈", fa: "لازم / نیاز", keywords: "필요" },
            { tagClass: "basic", tagText: "#기본단어", ko: "시간 / 시계", pron: "서앗", fa: "ساعت", keywords: "시간 시계" },
            { tagClass: "basic", tagText: "#기본단어", ko: "하지만 / 그러나", pron: "발리 / 암머", fa: "ولی / اما", keywords: "하지만 그러나" }
            { tagClass: "basic", tagText: "#기본단어", ko: "감사합니다", pron: "맘눈 / 메르시", fa: "ممنون / مرسی", keywords: "감사 고맙" }
        ];

        // 초기 화면 렌더링
        function renderCards() {
            const container = document.getElementById('cardContainer');
            container.innerHTML = '';
            
            wordData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-keyword', item.keywords + " " + item.ko);
                
                card.innerHTML = `
                    <span class="tag ${item.tagClass}">${item.tagText}</span>
                    <div class="ko-text">${item.ko}</div>
                    <div class="pronunciation">${item.pron}</div>
                    <div class="fa-text">${item.fa}</div>
                    <button class="copy-btn" onclick="copyText('${item.fa}')">📋 페르시아어 복사</button>
                `;
                container.appendChild(card);
            });
        }

        // 검색 필터 로직
        function filterCards() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('card');
            let hasVisibleCard = false;

            for (let i = 0; i < cards.length; i++) {
                let keywords = cards[i].getAttribute('data-keyword').toLowerCase();
                
                if (keywords.includes(input)) {
                    cards[i].style.display = "block";
                    hasVisibleCard = true;
                } else {
                    cards[i].style.display = "none";
                }
            }
            document.getElementById('noResultMsg').style.display = hasVisibleCard ? 'none' : 'block';
        }

        // 클립보드 복사 로직
        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("복사 완료! 톡으로 보내세요.");
            }).catch(err => {
                alert("복사 실패 ㅠㅠ 다시 시도해 주세요.");
            });
        }

        // 스크립트 로드 시 카드 렌더링 실행
        document.addEventListener("DOMContentLoaded", renderCards);
    </script>

</body>
</html>
