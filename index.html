<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페르시아어·이란학과 학과장실 홈페이지</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 초기화 및 기본 설정 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #f4f6f9; 
            color: #333; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; /* ★ 핵심: 100% 화면 꽉 채움 */
            overflow: hidden; /* ★ 핵심: 상하 스크롤바 원천 차단 */
        }

        /* === [보안] 로그인 오버레이 스타일 === */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0b2a4a; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white;
        }
        .login-box { text-align: center; background: rgba(255,255,255,0.1); padding: 40px; border-radius: 15px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .login-box h2 { font-family: 'Jua', sans-serif; margin-bottom: 20px; font-size: 2rem; }
        .login-input { padding: 15px; font-size: 1.2rem; border-radius: 8px; border: none; width: 200px; text-align: center; letter-spacing: 5px; }
        .login-btn { padding: 15px 30px; font-size: 1rem; border-radius: 8px; border: none; background: #217346; color: white; cursor: pointer; font-weight: bold; margin-left: 10px; transition: 0.2s; }
        .login-btn:hover { background: #1e6b41; transform: scale(1.05); }
        .login-msg { color: #ff6b6b; margin-top: 15px; font-weight: bold; height: 20px; }

        /* === 헤더 스타일 === */
        header {
            background-color: #0b2a4a;
            color: white;
            padding: 30px 0; /* 여백을 약간 늘려 안정감 부여 */
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .logo-box span {
            font-size: 2.2rem;
            display: inline-block;
            background: white;
            width: 65px;
            height: 65px;
            line-height: 65px;
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        h1 {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.7rem;
            letter-spacing: -0.5px;
            margin-top: 5px;
        }
        .sub-title { font-size: 0.9rem; opacity: 0.8; font-weight: 300; }

        /* 메인 콘텐츠 - 중앙 정렬 대시보드 형태 */
        main {
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center; /* 14~16인치 화면 기준 완벽한 세로 중앙 정렬 */
        }

        /* 그리드 메뉴 (정확히 2x2 배치로 고정) */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px; /* 카드 간격 최적화 */
        }

        /* 카드 스타일 */
        .card {
            background: white;
            border-radius: 12px;
            padding: 35px 25px; /* 내용물이 빠진 만큼 카드 볼륨업 */
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid #e1e4e8;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-color: #0b2a4a;
        }

        .icon-box {
            width: 65px;
            height: 65px;
            background-color: #f0f4f8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 1.6rem;
            color: #0b2a4a;
            transition: 0.3s;
        }
        .card:hover .icon-box {
            background-color: #0b2a4a;
            color: white;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #0b2a4a;
        }

        .card-desc {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.5;
            word-break: keep-all;
        }

        /* === 푸터 스타일 === */
        footer {
            background-color: #e9ecef;
            color: #868e96;
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2>🔒 관계자 외 접근 금지</h2>
            <p style="margin-bottom: 20px;">페르시아어·이란학과 조교 전용 페이지입니다.<br>비밀번호를 입력하세요.</p>
            <div>
                <input type="password" id="passwordInput" class="login-input" placeholder="****" onkeypress="if(event.keyCode==13) checkPw()">
                <button class="login-btn" onclick="checkPw()">확인</button>
            </div>
            <div id="loginMsg" class="login-msg"></div>
        </div>
    </div>

    <header>
        <div class="header-content">
            <div class="logo-box">
                <span>🏫</span>
            </div>
            <div>
                <div class="sub-title">Hankuk University of Foreign Studies</div>
                <h1>페르시아어·이란학과 학과장실 홈페이지</h1>
            </div>
        </div>
    </header>

    <main>
        <div class="menu-grid" id="menu-grid">
            </div>
    </main>

    <footer>
        <p>Copyright © <span id="year"></span> Dept. of Persian and Iranian Studies, HUFS. All rights reserved.</p>
    </footer>

    <script>
        // =========================================================================
        // [설정] 핵심 메뉴 4가지 (2x2 그리드 배열)
        // =========================================================================
        const menuList = [
            {
                title: "근무공정 생성",
                desc: "이번 달 근무 인정 시간 계산 및<br>근무 엑셀파일 자동 생성",
                icon: "fa-clipboard-list",
                link: "planner.html"
            },
            {
                title: "근무표 생성",
                desc: "조교 가용 시간을 취합하여<br>최적의 근무 스케줄 자동 편성",
                icon: "fa-calendar-alt",
                link: "scheduler.html"
            },
            {
                title: "학사일정표 제작",
                desc: "학과 주요 행사 및 학사 일정을<br>달력 형태로 시각화",
                icon: "fa-calendar-check",
                link: "calendar.html"
            },
            {
                title: "스마트 출석부",
                desc: "학과 행사 시 필요한<br>엑셀 출석부 자동 생성",
                icon: "fa-clipboard-user",
                link: "attendance.html"
            }
        ];

        // =========================================================================
        // [로직] 메뉴 자동 생성 및 보안 로직
        // =========================================================================
        
        // 1. 메뉴 렌더링
        const grid = document.getElementById('menu-grid');
        
        menuList.forEach(item => {
            const card = document.createElement('a');
            card.className = 'card';
            card.href = item.link;

            card.innerHTML = `
                <div class="icon-box"><i class="fas ${item.icon}"></i></div>
                <h2 class="card-title">${item.title}</h2>
                <p class="card-desc">${item.desc}</p>
            `;
            grid.appendChild(card);
        });

        // 2. 연도 자동 갱신
        document.getElementById('year').innerText = new Date().getFullYear();

        // 3. [보안] 비밀번호 설정 (1976) + LocalStorage 로그인 유지
        const ACCESS_PASSWORD = "1976"; 
        const STORAGE_KEY = "hufs_dept_access"; 

        window.onload = function() {
            document.getElementById('year').innerText = new Date().getFullYear();
            if (localStorage.getItem(STORAGE_KEY) === "granted") {
                document.getElementById('login-overlay').style.display = 'none';
            }
        };

        function checkPw() {
            const input = document.getElementById('passwordInput').value;
            const msg = document.getElementById('loginMsg');
            
            if(input === ACCESS_PASSWORD) {
                localStorage.setItem(STORAGE_KEY, "granted");
                document.getElementById('login-overlay').style.display = 'none';
            } else {
                msg.innerText = "비밀번호가 틀렸습니다.";
                document.getElementById('passwordInput').value = "";
            }
        }
    </script>

</body>
</html>
